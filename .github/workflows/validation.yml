name: validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck all shipped shell
        run: |
          shellcheck --version
          shellcheck \
            pmo-roadmap/install.sh \
            pmo-roadmap/update.sh \
            pmo-roadmap/hooks/pre-commit \
            pmo-roadmap/hooks/commit-msg \
            pmo-roadmap/hooks/post-commit \
            pmo-roadmap/bin/work-log-read \
            pmo-roadmap/bin/work-log-summarize \
            pmo-roadmap/bootstrap/adopt-project.sh \
            pmo-roadmap/bootstrap/new-project.sh \
            pmo-roadmap/bootstrap/session-intake.sh \
            pmo-roadmap/tests/adoption-discovery.sh \
            pmo-roadmap/tests/agent-surface.sh \
            pmo-roadmap/tests/canon-lint.sh \
            pmo-roadmap/tests/gate-parity.sh \
            pmo-roadmap/tests/roadmap-cli.sh \
            pmo-roadmap/tests/work-log-mvp.sh \
            demos/scripts/prepare-onboarding-demo.sh \
            demos/scripts/prepare-commit-demo.sh \
            demos/scripts/write-demo-contract.sh

  python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Core compiles and passes on the declared floor
        run: |
          python3 --version
          python3 -m py_compile pmo-roadmap/bin/dw
          python3 -m compileall -q pmo-roadmap/lib/dw_pmo
          python3 pmo-roadmap/tests/dw-core-tests.py

  shell-and-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check shell scripts
        run: |
          bash -n \
            pmo-roadmap/bin/work-log-read \
            pmo-roadmap/bin/work-log-summarize \
            pmo-roadmap/bootstrap/adopt-project.sh \
            pmo-roadmap/bootstrap/new-project.sh \
            pmo-roadmap/bootstrap/session-intake.sh \
            pmo-roadmap/hooks/pre-commit \
            pmo-roadmap/hooks/commit-msg \
            pmo-roadmap/hooks/post-commit \
            pmo-roadmap/install.sh \
            pmo-roadmap/update.sh \
            pmo-roadmap/tests/adoption-discovery.sh \
            pmo-roadmap/tests/agent-surface.sh \
            pmo-roadmap/tests/canon-lint.sh \
            pmo-roadmap/tests/gate-parity.sh \
            pmo-roadmap/tests/roadmap-cli.sh \
            pmo-roadmap/tests/work-log-mvp.sh \
            demos/scripts/prepare-onboarding-demo.sh \
            demos/scripts/prepare-commit-demo.sh \
            demos/scripts/write-demo-contract.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile pmo-roadmap/bin/dw
          python3 -m compileall -q pmo-roadmap/lib/dw_pmo

      - name: dw core unit tests
        run: python3 pmo-roadmap/tests/dw-core-tests.py

      - name: Canon lint
        run: pmo-roadmap/tests/canon-lint.sh

      - name: Adoption discovery smoke test
        run: pmo-roadmap/tests/adoption-discovery.sh

      - name: Agent surface integration test
        run: pmo-roadmap/tests/agent-surface.sh

      - name: Gate parity integration test
        run: pmo-roadmap/tests/gate-parity.sh

      - name: Roadmap CLI integration test
        run: pmo-roadmap/tests/roadmap-cli.sh

      - name: Roadmap self-validation (dogfood)
        run: pmo-roadmap/bin/dw check work-log-automation

      - name: Work log MVP integration test
        run: pmo-roadmap/tests/work-log-mvp.sh

      - name: Demo helper smoke test
        run: |
          demos/scripts/prepare-onboarding-demo.sh
          demos/scripts/prepare-commit-demo.sh
