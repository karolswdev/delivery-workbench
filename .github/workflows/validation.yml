name: validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # dw verify refuses shallow clones (exit 2): a truncated
          # history must never verify silently.
          fetch-depth: 0

      - name: Verify history against the gate's structural rules
        # Full sweep from the epoch on every push and PR: strictly
        # stronger than range plumbing, immune to force-push window
        # edge cases, and runs in seconds. Contract:
        # docs/remote-verification.md.
        run: python3 pmo-roadmap/bin/dw verify --all

      - name: Consumer upgrade path (v1.5.0 → current)
        # Lives in this job because it needs the full clone: the
        # fixture adopts from the real v1.5.0 tag.
        run: pmo-roadmap/tests/upgrade-path.sh

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build, install, bootstrap a fixture from the package
        # Proves the distribution contract: sdist+wheel build, isolated
        # install (pipx or venv+pip), packaged bootstrap to
        # doctor-green, guided status + deliberate-step story-to-commit loops, and
        # defer-to-repo rule. docs/distribution.md.
        run: pmo-roadmap/tests/package-smoke.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck all shipped shell
        # SC2317 excluded: the runner's shellcheck 0.9.0 flags functions
        # invoked indirectly (sourced pre-commit.local seams, traps) as
        # unreachable; 0.10+ replaced this with the smarter SC2329, which
        # the sources already disable with reasons where intentional.
        run: |
          shellcheck --version
          shellcheck -e SC2317 \
            pmo-roadmap/install.sh \
            pmo-roadmap/update.sh \
            pmo-roadmap/hooks/pre-commit \
            pmo-roadmap/hooks/commit-msg \
            pmo-roadmap/hooks/post-commit \
            pmo-roadmap/bin/work-log-read \
            pmo-roadmap/bin/work-log-summarize \
            pmo-roadmap/bootstrap/adopt-project.sh \
            pmo-roadmap/bootstrap/new-project.sh \
            pmo-roadmap/bootstrap/session-intake.sh \
            pmo-roadmap/tests/adoption-discovery.sh \
            pmo-roadmap/tests/agent-surface.sh \
            pmo-roadmap/tests/canon-lint.sh \
            pmo-roadmap/tests/gate-parity.sh \
            pmo-roadmap/tests/roadmap-cli.sh \
            pmo-roadmap/tests/work-log-mvp.sh \
            pmo-roadmap/tests/workbench-explorer.sh \
            pmo-roadmap/tests/workbench-ui-smoke.sh \
            pmo-roadmap/tests/plugin-validate.sh \
            pmo-roadmap/tests/mcp-server.sh \
            pmo-roadmap/tests/step-interop.sh \
            pmo-roadmap/tests/orchestration-interop.sh \
            pmo-roadmap/tests/contributor-flow.sh \
            pmo-roadmap/tests/guided-status-loop.sh \
            pmo-roadmap/tests/deliberate-step-loop.sh \
            pmo-roadmap/tests/package-smoke.sh \
            pmo-roadmap/tests/brew-formula-smoke.sh \
            pmo-roadmap/tests/upgrade-path.sh \
            pmo-roadmap/tests/verify-range.sh \
            pmo-roadmap/tests/docs-lint.sh \
            pmo-roadmap/tests/docs-snippet-smoke.sh \
            demos/scripts/prepare-onboarding-demo.sh \
            demos/scripts/prepare-commit-demo.sh \
            demos/scripts/write-demo-contract.sh \
            demos/scripts/capture-workbench-demo.sh \
            demos/scripts/render-social-preview.sh

  python-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Core compiles and passes on the declared floor
        run: |
          python3 --version
          python3 -m py_compile pmo-roadmap/bin/dw pmo-roadmap/bin/dw-workbench pmo-roadmap/bin/dw-mcp
          python3 -m py_compile pmo-roadmap/tests/orchestration-packaged-exam.py
          python3 -m compileall -q pmo-roadmap/lib/dw_pmo
          python3 pmo-roadmap/tests/dw-core-tests.py

  telegram-interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Telegram interface tests (scripted transport, fixture rails, no network)
        # Pillow serves only the screenshot-renderer legs (they skip
        # without it); it is a CI test amenity, never a runtime
        # dependency — the interface degrades to text captures.
        run: |
          python3 --version
          python3 -m pip install --quiet Pillow
          python3 -m compileall -q integrations/telegram
          python3 pmo-roadmap/tests/telegram-interface-tests.py

      - name: Telegram architecture fitness (layering + consent-floor guards)
        run: python3 pmo-roadmap/tests/telegram-fitness-tests.py

      - name: Credential grep-clean (WLA-13-06 acceptance)
        # No bot token, pairing token, or chat ID may appear anywhere
        # in the repo. A real Bot API token is <digits>:<35 url-safe
        # chars>; pairing tokens exist only at runtime (hashed at
        # rest); the operator config lives outside the repo and must
        # never be tracked.
        run: |
          set -eu
          if git grep -nE '[0-9]{6,}:[A-Za-z0-9_-]{30,}' -- ':!*.png' ':!*.gif'; then
            echo "ERROR: bot-token-shaped string tracked in the repo" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)telegram\.json$'; then
            echo "ERROR: operator telegram config tracked in the repo" >&2
            exit 1
          fi
          # WLA-14-06: the /send file leg must never let a runtime
          # secret ride out, and the same names must never be tracked.
          if git ls-files | grep -E '(^|/)(telegram-state\.json|agent-events\.jsonl|\.env|.*\.pem|id_rsa)$'; then
            echo "ERROR: a secret-shaped file is tracked in the repo" >&2
            exit 1
          fi
          echo "credential grep-clean: ok"

  holdspeak-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install holdspeak (pinned pack target, no runtime deps)
        # --no-deps is deliberate: the plugin surface (plugin_sdk,
        # plugins.host, plugin_pack_loader, synthesis) is stdlib-only
        # with lazy intel imports, and the full dep set drags in
        # PortAudio/X11 bindings a headless runner can't use. numpy is
        # the one exception — meeting_session (the E2E tests' meeting
        # row) imports it; a dev box usually has it, which is exactly
        # why CI is the honest floor here (WLA-12-02/03).
        # The pin matches the pack MANIFEST's proven range — re-certified
        # 2026-07-05 against v0.4.0 (commit ad5cb91): all 23 pack tests
        # pass unmodified, so the plugin surface is unchanged since v0.3.1.
        run: |
          pip install --no-deps "holdspeak @ git+https://github.com/karolswdev/HoldSpeak@v0.4.0"
          pip install numpy

      - name: HoldSpeak pack tests (discovery, host, failure shapes)
        run: python3 pmo-roadmap/tests/holdspeak-pack-tests.py

  shell-and-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Syntax check shell scripts
        run: |
          bash -n \
            pmo-roadmap/bin/work-log-read \
            pmo-roadmap/bin/work-log-summarize \
            pmo-roadmap/bootstrap/adopt-project.sh \
            pmo-roadmap/bootstrap/new-project.sh \
            pmo-roadmap/bootstrap/session-intake.sh \
            pmo-roadmap/hooks/pre-commit \
            pmo-roadmap/hooks/commit-msg \
            pmo-roadmap/hooks/post-commit \
            pmo-roadmap/install.sh \
            pmo-roadmap/update.sh \
            pmo-roadmap/tests/adoption-discovery.sh \
            pmo-roadmap/tests/agent-surface.sh \
            pmo-roadmap/tests/canon-lint.sh \
            pmo-roadmap/tests/gate-parity.sh \
            pmo-roadmap/tests/roadmap-cli.sh \
            pmo-roadmap/tests/work-log-mvp.sh \
            pmo-roadmap/tests/workbench-explorer.sh \
            pmo-roadmap/tests/workbench-ui-smoke.sh \
            pmo-roadmap/tests/plugin-validate.sh \
            pmo-roadmap/tests/mcp-server.sh \
            pmo-roadmap/tests/step-interop.sh \
            pmo-roadmap/tests/orchestration-interop.sh \
            pmo-roadmap/tests/contributor-flow.sh \
            pmo-roadmap/tests/guided-status-loop.sh \
            pmo-roadmap/tests/deliberate-step-loop.sh \
            pmo-roadmap/tests/package-smoke.sh \
            pmo-roadmap/tests/brew-formula-smoke.sh \
            pmo-roadmap/tests/upgrade-path.sh \
            pmo-roadmap/tests/verify-range.sh \
            pmo-roadmap/tests/docs-lint.sh \
            pmo-roadmap/tests/docs-snippet-smoke.sh \
            demos/scripts/prepare-onboarding-demo.sh \
            demos/scripts/prepare-commit-demo.sh \
            demos/scripts/write-demo-contract.sh \
            demos/scripts/capture-workbench-demo.sh \
            demos/scripts/render-social-preview.sh

      - name: Python syntax check
        run: |
          python3 -m py_compile pmo-roadmap/bin/dw pmo-roadmap/bin/dw-workbench pmo-roadmap/bin/dw-mcp
          python3 -m py_compile pmo-roadmap/tests/orchestration-packaged-exam.py
          python3 -m compileall -q pmo-roadmap/lib/dw_pmo

      - name: dw core unit tests
        run: python3 pmo-roadmap/tests/dw-core-tests.py

      - name: Canon lint
        run: pmo-roadmap/tests/canon-lint.sh

      - name: Docs lint (links, anchors, images, alt text)
        run: pmo-roadmap/tests/docs-lint.sh

      - name: Docs snippet smoke (quickstarts run as printed)
        run: pmo-roadmap/tests/docs-snippet-smoke.sh

      - name: Adoption discovery smoke test
        run: pmo-roadmap/tests/adoption-discovery.sh

      - name: Agent surface integration test
        run: pmo-roadmap/tests/agent-surface.sh

      - name: Gate parity integration test
        run: pmo-roadmap/tests/gate-parity.sh

      - name: Roadmap CLI integration test
        run: pmo-roadmap/tests/roadmap-cli.sh

      - name: Workbench explorer integration test
        run: pmo-roadmap/tests/workbench-explorer.sh

      - name: Workbench viewport smoke (skips without Firefox)
        run: pmo-roadmap/tests/workbench-ui-smoke.sh

      - name: MCP server integration test
        run: pmo-roadmap/tests/mcp-server.sh

      - name: Deliberate-step transport parity
        run: pmo-roadmap/tests/step-interop.sh

      - name: Orchestration run/control transport parity
        run: pmo-roadmap/tests/orchestration-interop.sh

      - name: Contributor flow integration test
        run: pmo-roadmap/tests/contributor-flow.sh

      - name: Claude Code plugin validation
        run: pmo-roadmap/tests/plugin-validate.sh

      - name: Homebrew formula smoke (macOS only)
        if: runner.os == 'macOS'
        run: pmo-roadmap/tests/brew-formula-smoke.sh

      - name: Roadmap self-validation (dogfood)
        run: pmo-roadmap/bin/dw check work-log-automation

      - name: Work log MVP integration test
        run: pmo-roadmap/tests/work-log-mvp.sh

      - name: Demo helper smoke test
        run: |
          demos/scripts/prepare-onboarding-demo.sh
          demos/scripts/prepare-commit-demo.sh

      - name: Asset capture smoke (skips without Firefox/ImageMagick)
        run: |
          demos/scripts/capture-workbench-demo.sh --smoke
          demos/scripts/render-social-preview.sh --smoke
