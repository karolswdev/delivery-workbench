<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delivery Workbench</title>
  <script>
    if (new URLSearchParams(location.search).has("snapshot")) {
      document.documentElement.classList.add("reduced-motion");
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="skip-link" id="skip-link" type="button">Skip to main content</button>
  <header class="topbar">
    <a class="brand" href="#/">Delivery&nbsp;Workbench</a>
    <nav class="primary-nav" aria-label="Primary">
      <a class="navlink" href="#/board" id="work-link">Work</a>
      <a class="navlink" href="#/health" id="health-link">Health</a>
      <div class="advanced-nav-wrapper">
        <button class="navlink advanced-toggle" id="advanced-toggle" type="button" aria-expanded="false" aria-controls="advanced-dropdown">Advanced <span class="advanced-chevron" aria-hidden="true">&#9662;</span></button>
        <div class="advanced-dropdown" id="advanced-dropdown" role="menu">
          <div class="advanced-group">
            <span class="advanced-group-label">Plan</span>
            <a class="advanced-item" href="#/program-studio" role="menuitem" id="plan-link">Delivery options</a>
            <a class="advanced-item" href="#/edit" role="menuitem">Roadmap changes</a>
          </div>
          <div class="advanced-group">
            <span class="advanced-group-label">Delivery</span>
            <a class="advanced-item" href="#/orchestration" role="menuitem" id="delivery-link">Delivery plans</a>
          </div>
          <div class="advanced-group">
            <span class="advanced-group-label">Live</span>
            <a class="advanced-item" href="#/live" role="menuitem" id="live-link">Mission control</a>
            <a class="advanced-item" href="#/mc" role="menuitem">Activity</a>
          </div>
        </div>
      </div>
    </nav>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb">
      <a class="project-switcher ops-label" id="project-switcher" href="#/projects" title="Switch project">
        <span class="crumb-zone">work</span><span class="crumb-separator" aria-hidden="true">/</span><span class="crumb-project">Choose project</span>
      </a>
    </nav>
    <button class="topbar-omni" id="command-palette-trigger" type="button" aria-label="Search projects, stories, and runs" aria-keyshortcuts="Meta+K Control+K">
      <span class="omni-icon" aria-hidden="true">⌕</span><span class="omni-text">Search work</span><kbd aria-hidden="true">⌘K</kbd>
    </button>
    <div class="topbar-tools" role="group" aria-label="Display and refresh controls">
      <button id="density-toggle" class="shell-icon-btn density-toggle" type="button" aria-label="Use compact density" aria-pressed="false" title="Density: comfortable. Switch to compact."><span aria-hidden="true">↕</span><span class="visually-hidden" id="density-state">Comfortable</span></button>
      <button id="refresh-btn" class="shell-icon-btn" type="button" title="Refresh saved repository facts" aria-label="Refresh saved repository facts"><span aria-hidden="true">↻</span></button>
    </div>
  </header>
  <main id="app" class="app" tabindex="-1" aria-busy="true">
    <section class="route-skeleton" aria-label="Loading view">
      <div class="route-skeleton-head"><dw-skeleton lines="2" variant="text"></dw-skeleton></div>
      <div class="route-skeleton-grid"><dw-skeleton lines="5" variant="card"></dw-skeleton><dw-skeleton lines="5" variant="card"></dw-skeleton></div>
      <span class="visually-hidden" data-route-loading>Loading saved repository facts…</span>
    </section>
  </main>
  <div id="route-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="live-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <footer class="footbar" title="Served from this repository">
    <span id="dw-connection-status" class="dw-connection-status" title="Event stream disconnected"></span>
    <span>Browsing is read-only · actions require confirmation</span>
    <code id="foot-root" class="visually-hidden">this repository</code>
  </footer>
  <script src="components.js"></script>
  <script src="interactions.js"></script>
  <script src="layout.js"></script>
  <script src="design.js"></script>
  <script src="core.js"></script>
  <script src="memory-panel.js"></script>
  <script src="board.js"></script>
  <script src="views.js"></script>
  <script src="editor.js"></script>
  <script src="orchestration.js"></script>
  <script src="runs.js"></script>
  <script src="studio.js"></script>
  <script src="session-panel.js"></script>
  <script src="ask-resume.js"></script>
  <script src="diff-panel.js"></script>
  <script src="insights-panel.js"></script>
  <script src="telemetry-panel.js"></script>
  <script src="services-panel.js"></script>
  <script src="context-panel.js"></script>
  <script src="global-events.js"></script>
  <script src="needs-you.js"></script>
  <script src="command-palette.js"></script>
  <script src="outcomes-panel.js"></script>
  <script src="suggestions-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
